name: ci
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - run: pipx run codespell
  ruff_check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - run: pipx run ruff check --output-format=github
