name: 🏗️ Repository Structure Manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - validate
          - restructure-preview
          - restructure-apply
          - auto-fix
        default: 'validate'

jobs:
  structure-manager:
    runs-on: ubuntu-latest

    steps:
    - name: 🧾 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🐍 Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Install dependencies
      run: |
        pip install black ruff bandit radon autoflake isort autopep8

    # ==========================================
    # VALIDATION MODE
    # ==========================================
    - name: 🔍 Validate Python Files
      if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'validate'
      run: |
        echo "🔍 Running validation checks..."

        # Black check
        black --check . || echo "⚠️ Black formatting issues found (run auto-fix to fix them)"

        # Ruff linting
        ruff check . || echo "⚠️ Ruff linting issues found"

        # Bandit security
        bandit -r . -ll -x ./system/executingSystemCommands.py || echo "⚠️ Security issues found (B602/B605 suppressed for known shell usage)"

        echo "✅ Validation completed."

    # ==========================================
    # AUTO-FIX MODE
    # ==========================================
    - name: 🔧 Auto-Fix Code Issues
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'auto-fix'
      run: |
        echo "🔧 Running auto-fix..."

        # Remove unused imports
        echo "🧹 Removing unused imports..."
        autoflake --remove-all-unused-imports --remove-unused-variables -r -i . || true

        # Format code with Black
        echo "🎨 Applying Black formatting..."
        black . || true

        # Organize imports
        echo "📦 Organizing imports..."
        isort . || true

        # Fix PEP8 issues
        echo "📏 Fixing PEP8 issues..."
        autopep8 --in-place --aggressive --aggressive -r . || true

        echo "✅ Auto-fix completed."

    # ==========================================
    # RESTRUCTURE MODE (preview/apply)
    # ==========================================
    - name: 🔄 Restructure Repository
      if: github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'restructure-preview' || github.event.inputs.mode == 'restructure-apply')
      run: |
        MODE=${{ github.event.inputs.mode }}
        echo "🌀 Running restructure mode: $MODE"

        python << 'EOF'
        import os, shutil, re
        from pathlib import Path

        DRY_RUN = "${{ github.event.inputs.mode }}" == "restructure-preview"

        STRUCTURE = {
            'games': [
                'Dice', 'RollTheDice.py', 'dice.py', 'Dice Part 2.py',
                'EnhancedS&L.py', 'S&L1Player.py', 'S&L2Player.py',
                'Monster Duelz.py', 'TerminalDriftGame.py',
                'TerminalQuizShowdown.py', 'Countries.py'
            ],
            'math': [
                'Age.py', 'DataTypes.py', 'Fibonacci.py', 'VAT.py',
                'VolumeOfSphere.py', 'discount.py', 'float.py',
                'mathsquiz.py', 'times tables.py', 'heart.py'
            ],
            'utilities': [
                'FileSorter.py', 'MoodMusicSuggester.py', 'TheZenOfPython.py',
                'TypingSpeedTest.py', 'Username.py', 'encrypting_tool.py',
                'executingSystemCommands.py', 'comic(ig).py'
            ],
            'learning': [
                'MyFirstProgram.py', 'Code.py', 'Story.py',
                'loops.py', 'jokes.py', 'Name.py', 'time.py'
            ],
            'random_generators': [
                'FortuneTeller.py', 'Lucky.py', 'heads vs tails.py',
                'numbergame.py'
            ],
            'simulations': [
                'Hertz.py', 'Month.py', 'YearGroups.py', 'Waiter.py',
                'Security.py', 'basketball.py', 'DictCommand.py',
                'FootballTeam.py'
            ]
        }

        print("🔄 Repository restructure running...")
        moved_count = 0

        # Ensure directories exist
        for directory in STRUCTURE:
            Path(directory).mkdir(exist_ok=True)
            print(f"📁 Ensured directory: {directory}/")

        # Move files to correct directories
        for target_dir, files in STRUCTURE.items():
            for pattern in files:
                possible_paths = [Path(pattern)]
                for old_dir in ['Number', 'Dice', 'Other Programs', 'system']:
                    possible_paths.append(Path(old_dir) / pattern)

                for old_path in possible_paths:
                    if old_path.exists():
                        new_path = Path(target_dir) / old_path.name
                        if DRY_RUN:
                            print(f"[DRY RUN] Would move: {old_path} → {new_path}")
                        else:
                            try:
                                shutil.move(str(old_path), str(new_path))
                                moved_count += 1
                                print(f"✅ Moved: {old_path} → {new_path}")
                            except Exception as e:
                                print(f"❌ Failed to move {old_path}: {e}")

        # Convert filenames to snake_case
        def to_snake_case(name: str) -> str:
            name = re.sub(r'[^\w\s-]', '', name)  # Remove special chars
            name = re.sub(r'[-\s]+', '_', name)   # Replace spaces/dashes with underscores
            name = re.sub(r'([a-z0-9])([A-Z])', r'\1_\2', name)  # camelCase → snake_case
            return name.lower()

        renamed_count = 0
        for py_file in Path('.').rglob('*.py'):
            if '__pycache__' in str(py_file) or '.git' in str(py_file):
                continue

            new_name = to_snake_case(py_file.stem) + '.py'
            if py_file.name != new_name:
                new_path = py_file.parent / new_name
                if DRY_RUN:
                    print(f"[DRY RUN] Would rename: {py_file.name} → {new_name}")
                else:
                    py_file.rename(new_path)
                    renamed_count += 1
                    print(f"🐍 Renamed: {py_file.name} → {new_name}")

        print(f"\n📦 Summary:")
        print(f" - Files moved: {moved_count}")
        print(f" - Files renamed: {renamed_count}")
        print(f" - Mode: {'DRY RUN' if DRY_RUN else 'LIVE APPLY'}")
        EOF
