name: 🏗️ Repository Structure & Code Manager

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - validate
          - auto-fix
          - restructure-preview
          - restructure-apply
        default: 'validate'

jobs:
  manager:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------
      # Checkout code
      # --------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------
      # Setup Python environment
      # --------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install black ruff mypy pylint bandit isort autoflake autopep8 radon safety codespell

      # ======================================
      # VALIDATION MODE
      # ======================================
      - name: 🔍 Run validation checks
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode == 'validate'
        run: |
          echo "🐍 Checking Python syntax..."
          error_count=0
          while IFS= read -r file; do
            if ! python -m py_compile "$file" 2>/dev/null; then
              echo "❌ Syntax error: $file"
              ((error_count++))
            fi
          done < <(find . -name "*.py" -type f | grep -v "__pycache__")
          if [ $error_count -gt 0 ]; then
            echo "⚠️ $error_count Python syntax errors found"
            exit 1
          fi

          echo "🎨 Checking formatting (Black)..."
          black --check . || echo "⚠️ Some files would be reformatted (run auto-fix to fix)"

          echo "🔬 Linting (Ruff)..."
          ruff check . --output-format=github || echo "⚠️ Ruff linting issues found"

          echo "📚 Checking docstrings..."
          python - << 'EOF'
import ast, sys
from pathlib import Path
def check_docs(file):
    missing=[]
    try:
        tree=ast.parse(open(file,encoding='utf-8').read())
        for node in ast.walk(tree):
            if isinstance(node,(ast.FunctionDef,ast.ClassDef,ast.AsyncFunctionDef)):
                if not ast.get_docstring(node) and not node.name.startswith("_"):
                    missing.append(f"{node.name} (line {node.lineno})")
    except SyntaxError:
        pass
    return missing
for f in Path(".").rglob("*.py"):
    if "__pycache__" in str(f) or ".git" in str(f): continue
    m=check_docs(f)
    if m: print(f"{f}: {m}")
EOF

          echo "🔒 Security scan (Bandit)..."
          bandit -r . -ll || echo "⚠️ Security issues found"

      # ======================================
      # AUTO-FIX MODE
      # ======================================
      - name: 🔧 Auto-fix code issues
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'auto-fix'
        run: |
          echo "🔧 Running auto-fixes..."
          echo "🧹 Removing unused imports..."
          autoflake --remove-all-unused-imports --remove-unused-variables -r -i . || true
          
          echo "🎨 Formatting code (Black)..."
          black . || true
          
          echo "📦 Organizing imports (isort)..."
          isort . || true
          
          echo "📏 Fixing PEP8 issues..."
          autopep8 --in-place --aggressive --aggressive -r . || true
          
          echo "🐍 Converting filenames to snake_case..."
          python - << 'EOF'
import re
from pathlib import Path

def to_snake(name):
    name = re.sub(r'[^\w\s-]', '', name)
    name = re.sub(r'[-\s]+', '_', name)
    name = re.sub(r'([a-z0-9])([A-Z])', r'\1_\2', name)
    return name.lower()

for f in Path('.').rglob('*.py'):
    if '__pycache__' in str(f) or '.git' in str(f): continue
    new_name = to_snake(f.stem)+'.py'
    if f.name != new_name:
        new_path = f.parent / new_name
        print(f"Renaming {f} -> {new_path}")
        f.rename(new_path)
EOF

          echo "✅ Auto-fix complete!"

      # ======================================
      # RESTRUCTURE MODE
      # ======================================
      - name: 🔄 Restructure repository
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'restructure-preview' || github.event.inputs.mode == 'restructure-apply')
        run: |
          DRY_RUN=${{ github.event.inputs.mode == 'restructure-preview' && 'true' || 'false' }}
          python - << 'EOF'
import shutil
from pathlib import Path

STRUCTURE={
    'games': ['Dice','RollTheDice.py','dice.py','Dice Part 2.py'],
    'math': ['Fibonacci.py','DataTypes.py'],
    'utilities': ['FileSorter.py','MoodMusicSuggester.py']
}

dry_run = '${DRY_RUN}' == 'true'

for dir_name in STRUCTURE.keys():
    if not dry_run: Path(dir_name).mkdir(exist_ok=True)
    print(f"{'[DRY RUN]' if dry_run else '✅'} Create dir {dir_name}")

for target, files in STRUCTURE.items():
    for f in files:
        for old_path in Path('.').rglob(f):
            new_path = Path(target)/old_path.name
            if dry_run:
                print(f"[DRY RUN] {old_path} -> {new_path}")
            else:
                shutil.move(str(old_path), str(new_path))
                print(f"✅ Moved {old_path} -> {new_path}")
EOF

      # ======================================
      # COMMIT CHANGES
      # ======================================
      - name: 💾 Commit and push changes
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'auto-fix' || github.event.inputs.mode == 'restructure-apply')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🤖 Auto-fix and restructure applied"
            git push
            echo "✅ Changes committed and pushed"
          else
            echo "ℹ️ No changes to commit"

      # ======================================
      # SUMMARY
      # ======================================
      - name: 📊 Workflow summary
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════"
          echo "       WORKFLOW SUMMARY"
          echo "════════════════════════════════"
          echo "Mode: ${{ github.event.inputs.mode || 'Automatic validation' }}"
          echo "✅ Validation complete!"
