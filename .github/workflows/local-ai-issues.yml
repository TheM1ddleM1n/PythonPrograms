name: AI Issue Assistant 🤖

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  ai_response:
    name: Generate AI Response
    runs-on: ubuntu-latest
    if: contains(github.event.issue.body, '@bot') || contains(github.event.comment.body, '@bot')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get issue/comment body
        id: content
        run: |
          BODY="${{ github.event.comment.body || github.event.issue.body }}"
          echo "user_message<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call Hugging Face API
        id: ai
        run: |
          PROMPT="You are a helpful Python programming assistant for the PythonProgramsV3 repository. The user asked:\n\n${{ steps.content.outputs.user_message }}\n\nProvide a helpful response with code examples if relevant."
          
          RESPONSE=$(curl -s -X POST \
            "https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.1" \
            -H "Authorization: Bearer ${{ secrets.HF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"inputs\": \"$PROMPT\"}" | jq -r '.[0].generated_text // "Error generating response"')
          
          echo "ai_response<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post AI response as comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            🤖 **AI Assistant Response** (triggered by @bot mention)
            
            Model: Mistral 7B via Hugging Face
            
            ---
            
            ${{ steps.ai.outputs.ai_response }}
            
            ---
            
            *Tip: Mention @bot in any issue/comment to get AI assistance!*
