name: Local AI Issue Chatbot

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  local-ai-chat:
    runs-on: ubuntu-latest
    # Only run if issue/comment contains @bot mention
    if: >
      (github.event_name == 'issues' && contains(toLower(github.event.issue.body || ''), '@bot')) ||
      (github.event_name == 'issue_comment' && contains(toLower(github.event.comment.body || ''), '@bot'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install and Start Ollama
        run: |
          echo "Installing Ollama..."
          curl -fsSL https://ollama.ai/install.sh | sh
          echo "Starting Ollama server manually..."
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 8

      - name: Check Ollama status
        run: |
          echo "Checking Ollama server..."
          if curl -s http://127.0.0.1:11434/api/tags > /dev/null; then
            echo "✅ Ollama server is running."
          else
            echo "❌ Ollama failed to start."
            echo "Server logs:"
            cat /tmp/ollama.log || true
            exit 1
          fi

      - name: Pull local model
        run: |
          echo "Pulling local model..."
          ollama pull llama3 || ollama pull phi3 || ollama pull codellama
          ollama list

      - name: Prepare prompt
        id: prompt
        run: |
          echo "Preparing prompt..."
          cat <<'PROMPT' > prompt.txt
          You are a helpful coding assistant bot for the PythonProgramsV3 repository.
          You were mentioned with @bot to help answer questions or provide assistance.
          
          Read the user's message below, understand their intent, and reply helpfully.

          Provide:
          - A clear, friendly answer or suggestion.
          - Example code if relevant (using Python).
          - Follow-up questions if more info is needed.

          If the text looks like a bug report, suggest possible causes and debugging steps.
          If it's a feature request, propose implementation ideas.
          If they're asking about existing programs, refer to the repository structure.

          === USER MESSAGE ===
          PROMPT

          if [[ "${{ github.event_name }}" == "issues" ]]; then
            echo "${{ github.event.issue.title }}" >> prompt.txt
            echo "${{ github.event.issue.body }}" >> prompt.txt
          else
            echo "${{ github.event.comment.body }}" >> prompt.txt
          fi

      - name: Run Local LLM Response
        id: respond
        run: |
          echo "🤖 Generating AI response..."
          ollama run llama3 < prompt.txt > reply.txt
          
          echo "reply<<EOF" >> $GITHUB_OUTPUT
          cat reply.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post AI reply as comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number || github.event.issue.number }}
          body: |
            🤖 **AI Bot Response** (triggered by @bot mention)
            
            Model: `llama3` via Ollama
            
            ---
            
            ${{ steps.respond.outputs.reply }}
            
            ---
            
            *Tip: Mention @bot in any comment or issue to get AI assistance!*
