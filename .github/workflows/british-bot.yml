name: British Banter Bot 🇬🇧

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  banter:
    name: Generate Banter
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "British Banter Bot 🇬🇧"
          git config user.email "banter@example.com"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet HEAD~1 HEAD || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Generate Banter Message
        id: message
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          messages=(
            "fix: squashed that bug like a proper legend 💂🛠️🔥"
            "feat: added a cheeky new feature, sorted innit bruv 🧃✨💂"
            "chore: tidied up the config, all neat now 🔥🧃🧹"
            "docs: wrote it all down like a true gent 💂📚🧃"
            "refactor: cleaned up the mess, proper tidy 🔧💂🧃"
            "style: made it look snazzy, innit 🎨🧃💂"
            "test: gave it a proper poke, all green now ✅💂🧃"
            "fix: patched it up like a boss 🔥🛠️💂"
            "feat: dropped a spicy new bit of code 🌶️💂🧃"
            "chore: decluttered the codebase, lovely jubbly 🧽💂✨"
          )
          RANDOM_INDEX=$((RANDOM % ${#messages[@]}))
          COMMIT_MSG="${messages[$RANDOM_INDEX]}"
          echo "commit_message=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Amend last commit with banter
        if: steps.changes.outputs.has_changes == 'true'
        env:
          COMMIT_MSG: ${{ steps.message.outputs.commit_message }}
        run: |
          git commit --amend -m "$COMMIT_MSG" --no-edit || echo "No changes to amend"
          git push --force-with-lease origin main || echo "Nothing to push"

      - name: Drop a Cheeky Comment
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMENT="Nice one, bruv! — commit \`$COMMIT_SHA\` is looking mint 💂🧃"
          
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"$COMMENT\"}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$COMMIT_SHA/comments" || echo "⚠️ Comment failed"
