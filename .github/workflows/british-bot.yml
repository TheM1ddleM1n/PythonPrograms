name: British Banter Bot 🇬🇧

on:
  push:
    branches:
      - main

jobs:
  banter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history for safe rebase

      - name: Configure Git
        run: |
          git config user.name "The British Banters Bot"
          git config user.email "banterbot@example.com"

      - name: Fetch and Rebase
        run: |
          git fetch origin main
          git rebase origin/main || echo "No changes to rebase"

      - name: Generate Banter Message
        id: message
        run: |
          messages=(
            "fix: squashed that bug like a proper legend 💂🛠️🔥"
            "feat: added a cheeky new feature, sorted innit bruv 🧃✨💂"
            "chore: tidied up the config, all neat now 🔥🧃🧹"
            "docs: wrote it all down like a true gent 💂📚🧃"
            "refactor: cleaned up the mess, proper tidy 🔧💂🧃"
            "style: made it look snazzy, innit 🎨🧃💂"
            "test: gave it a proper poke, all green now ✅💂🧃"
            "fix: patched it up like a boss 🔥🛠️💂"
            "feat: dropped a spicy new bit of code 🌶️💂🧃"
            "chore: decluttered the codebase, lovely jubbly 🧽💂✨"
            "docs: documented this like a right scholar 📚💂🧃"
            "refactor: reworked the logic, much better now mate 🔧💂🧃"
            "style: made it look mint, absolutely chuffed 😎💂🧃"
            "test: poked it with a stick, it held up 🧃💂🧪"
            "fix: debugged the gremlins out of this one 🐛💂🔥"
            "feat: rolled out a cracking feature 🎯💂🧃"
            "docs: wrote up a proper guide, cheers 📝💂🧃"
            "refactor: optimised like a champion 🏆💂🧃"
            "style: beautified the code, absolutely gorgeous 💄💂🧃"
            "test: verified everything, all tickety-boo ✔️💂🧃"
          )
          RANDOM_INDEX=$((RANDOM % ${#messages[@]}))
          COMMIT_MSG="${messages[$RANDOM_INDEX]}"
          echo "commit_message=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Commit and Push
        env:
          GH_TOKEN: ${{ secrets.GH_BANTER_TOKEN }}
        run: |
          git add .

          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit, skipping push."
            exit 0
          fi

          git commit -m "${{ steps.message.outputs.commit_message }}"
          
          # Pull & rebase again just in case new commits landed
          git pull --rebase origin main || echo "No changes to rebase"
          
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} HEAD:main

      - name: Drop a Cheeky Comment
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_BANTER_TOKEN }}
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMENT="Nice one, bruv! — commit \`$COMMIT_SHA\` is looking mint 💂🧃"
          curl -s -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\": \"$COMMENT\"}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/$COMMIT_SHA/comments"
